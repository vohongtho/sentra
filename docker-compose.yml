# Local stack: PostgreSQL, Keycloak (sample realm), Mailpit (SMTP sink), Sentra API/BFF and a separate worker.
# Development only. Copy env.example to .env and set values; never reuse these outside a laptop.
name: sentra
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentra
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sentra"], interval: 5s, retries: 20 }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes: ["./keycloak/sentra-realm.json:/opt/keycloak/data/import/sentra-realm.json:ro"]
    ports: ["127.0.0.1:8081:8081"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]

  app: &app
    build: .
    depends_on: { postgres: { condition: service_healthy } }
    environment: &appenv
      SENTRA_ENV: development
      PORT: "8080"
      APP_ORIGIN: http://localhost:8080
      PGHOST: postgres
      PGDATABASE: sentra
      PGUSER: sentra
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SENTRA_MASTER_KEY: ${SENTRA_MASTER_KEY:?set SENTRA_MASTER_KEY (openssl rand -base64 32)}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      KEYCLOAK_ISSUER: http://keycloak:8081/realms/sentra
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8081/realms/sentra
      KEYCLOAK_CLIENT_ID: sentra
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET to the realm client value}
      KEYCLOAK_ALLOW_HTTP: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: sentra@localhost
      OBJECT_STORE_DIR: /data/objects
      RUN_WORKERS: "false"
      RUN_SCHEDULER: "false"
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes: [objects:/data/objects]
    ports: ["127.0.0.1:8080:8080"]

  worker:
    <<: *app
    environment:
      <<: *appenv
      RUN_WORKERS: "true"
      RUN_SCHEDULER: "true"
      SEED_DEMO: "false"
    ports: []

volumes: { pgdata: {}, objects: {} }
